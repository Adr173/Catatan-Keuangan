<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7573a8">
<title>Catatan Keuangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alike&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">

  <h1>Catatan keuangan</h1>

  <div class="search">
    <input id="q" class="pill-input" type="search" placeholder="Cari Kata Kunci" enterkeyhint="search" autocomplete="off">
    <button id="searchBtn" class="round" type="button" aria-label="Cari">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
    </button>
    <div class="plus-group">
      <button id="addTrx" class="plus pink" type="button" aria-label="Tambah pemasukkan atau pengeluaran">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
      </button>
      <button id="addShopee" class="plus blue" type="button" aria-label="Tambah pemasukkan Shopee">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
      </button>
    </div>
  </div>

  <section class="cards">
    <div class="card c1"><b>Total Saldo</b><span id="vTotal">Rp 0</span></div>
